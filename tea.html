<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>нажми пж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d9efd0; --bg2: #f6e3ef; --ink: #1f3a2b; --paper: #fffaf3;
    --yes: #ff5c93; --yes-ink: #ffffff; --no: #ffffff; --no-ink: #1f3a2b;
    --shadow: rgba(31, 58, 43, .28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12261b; --bg2: #2a1a2b; --ink: #eaf6e4; --paper: #fff3e0;
      --yes: #ff6fa2; --no: #24402f; --no-ink: #eaf6e4; --shadow: rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12261b; --bg2: #2a1a2b; --ink: #eaf6e4; --paper: #fff3e0;
    --yes: #ff6fa2; --no: #24402f; --no-ink: #eaf6e4; --shadow: rgba(0,0,0,.55);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 80% at 20% 0%, var(--bg2) 0%, transparent 60%), var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600;
  }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px 22px; gap: 10px; }
  .frame {
    width: min(62vw, 270px, 34vh); aspect-ratio: 1; background: var(--paper); padding: 8px; border-radius: 22px;
    box-shadow: 0 8px 0 var(--shadow); transform: rotate(-2.5deg);
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; display: block; }
  .frame.pop { animation: pop .4s cubic-bezier(.3,1.7,.5,1); }
  @keyframes pop { 0% { transform: rotate(-2.5deg) scale(.8); } 60% { transform: rotate(3deg) scale(1.06); } 100% { transform: rotate(-2.5deg) scale(1); } }
  h1 { font-family: "Unbounded", "Arial Black", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(22px, 7vw, 34px); line-height: 1.14; margin: 6px 0 0; max-width: 14em; }
  .sub { font-size: 17px; max-width: 22em; margin: 0; min-height: 3em; line-height: 1.35; }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 8px; }
  button { font: inherit; font-weight: 800; border: 0; cursor: pointer; border-radius: 999px; padding: 14px 26px;
    font-size: 18px; box-shadow: 0 6px 0 var(--shadow); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #yes { background: var(--yes); color: var(--yes-ink); transform: scale(var(--g, 1)); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  #yes:active { transform: scale(calc(var(--g, 1) * .95)); }
  .slot { display: inline-block; }
  #no { background: var(--no); color: var(--no-ink); }
  #no.fly { position: fixed; z-index: 10; transition: left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1); }
  #done { display: none; overflow-y: auto; justify-content: safe center; }
  .note { max-width: 21em; margin: 0; font-size: 15px; line-height: 1.35; background: var(--paper); color: #3a2a1f; padding: 10px 14px; border-radius: 14px; transform: rotate(1.2deg); box-shadow: 0 4px 0 var(--shadow); }
  .ask2 { margin: 6px 0 0; font-size: 15px; }
  #fallback { margin-top: 4px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .links a, .links button { background: var(--no); color: var(--no-ink); padding: 9px 14px; font-size: 15px; border-radius: 999px; font-weight: 800; text-decoration: none; box-shadow: 0 4px 0 var(--shadow); }
  body.won #ask { display: none; }
  body.won #done { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pair { display: flex; gap: 14px; justify-content: center; }
  .pair .frame { width: min(32vw, 130px, 17vh); padding: 6px; border-radius: 16px; }
  .pair .frame img { border-radius: 11px; }
  .pair .frame:nth-child(2) { transform: rotate(3deg); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { background: var(--no); color: var(--no-ink); padding: 10px 16px; font-size: 16px; box-shadow: 0 4px 0 var(--shadow); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  #sendNote { font-size: 15px; min-height: 1.4em; margin: 0; max-width: 22em; }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  @media (prefers-reduced-motion: reduce) { .frame.pop { animation: none; } }
</style>
</head>

  function dodge() {
    if (surrendered) return;
    tries++;
    var r = no.getBoundingClientRect();
    if (!no.classList.contains("fly")) {
      slot.style.width = r.width + "px"; slot.style.height = r.height + "px";

      var clear = x + w < yr.left - 10 || x > yr.right + 10 || y + h < yr.top - 10 || y > yr.bottom + 10;

      if (far && clear) break;
    }
    no.style.left = best.x + "px"; no.style.top = best.y + "px";
  }

  var when = "";
  var whens = document.querySelectorAll(".when");
  whens.forEach(function (c) {
    c.addEventListener("click", function () {
      whens.forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true"); when = c.textContent.toLowerCase();
    });
  });
  $("copy").addEventListener("click", function () {
    var note = $("sendNote");
    if (!when) { note.textContent = "Сначала выбери, когда пьём 👆"; return; }
    var text = "Балда, да, пойдём пить чай! ☕ Давай " + when + "." +
      (wantPastila ? " И пастилу хочу 🍬" : "") + " — подружка идиотка";
    var ok = function () { note.textContent = "Скопировано ✓ Теперь вставь это балде в чат и отправь 💌"; };
    var fail = function () { note.textContent = "Не скопировалось. Перепиши балде вручную: " + text; };
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
  });

  function confetti() {
    var cv = $("fx"), ctx = cv.getContext("2d");
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    var cols = ["#ff5c93", "#ffd166", "#06d6a0", "#118ab2", "#ffffff"], ps = [];
    for (var i = 0; i < 140; i++) ps.push({ x: cv.width / 2, y: cv.height * 0.55,
      vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4, s: 6 + Math.random() * 7,
      c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
    var t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(function (p) {
        p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); ctx.restore();
      });
      if (t - t0 < 3500) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
    })(t0);
  }
</script>
